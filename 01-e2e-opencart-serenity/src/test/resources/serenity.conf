serenity {
  project.name = "OpenCart - Flujo de compra E2E"
  # Captura de pantalla en cada accion (evidencia en el reporte)
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}

webdriver {
  driver = chrome
  autodownload = true
  base.url = "http://opencart.abstracta.us"
  timeouts {
    implicitlywait = 5000
    fluentwait = 15000
  }
  wait.for.timeout = 15000

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "window-size=1920,1080", "remote-allow-origins=*",
              "disable-gpu", "no-sandbox", "disable-dev-shm-usage",
              "disable-search-engine-choice-screen"]
    }
  }
}

# Modo sin interfaz grafica: mvn clean verify -Dheadless.mode=true
headless.mode = false
